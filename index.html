<style>
:root{color-scheme:dark;--ink:#fff;--mute:rgba(255,255,255,.65);--glass:rgba(255,255,255,.13);--line:rgba(255,255,255,.28);--green:#3ff2a5;--red:#ff6b81;--blue:#5ab0ff;
--bg0:#1b1038;--bg1:#1b1038;--bg2:#2a1458;--bg3:#0e2a5c;--k1:#ff3d9a;--k2:#22d3ee;--k3:#8b5cf6;--k4:#fbbf24;--ko:.75;
--pbbg:rgba(255,255,255,.18);--pb1:#3ff2a5;--pb2:#22d3ee;--field:rgba(255,255,255,.12);--fieldf:rgba(255,255,255,.2);--ph:rgba(255,255,255,.45);--optbg:#2a1458;
--btnink:#1b1038;--g1:#3ff2a5;--g2:#5ab0ff;--p1:#ff6bb5;--p2:#ffb86b;--accb:linear-gradient(135deg,rgba(255,107,181,.45),rgba(255,184,107,.4));
--gh:#ffd166;--line2:rgba(255,255,255,.14);--chip:rgba(255,255,255,.16);--grp:rgba(255,255,255,.08);--drawer:rgba(40,20,90,.7);--toast:rgba(30,15,70,.85);
--salbg:linear-gradient(135deg,rgba(63,242,165,.38),rgba(90,176,255,.32),rgba(192,132,252,.3))}
:root[data-theme=light]{color-scheme:light;--ink:#1f1536;--mute:rgba(31,21,54,.62);--glass:rgba(255,255,255,.55);--line:rgba(140,110,200,.3);--green:#0b9a68;--red:#e11d48;--blue:#2563eb;
--bg0:#f3e8ff;--bg1:#f6ecff;--bg2:#e3f0ff;--bg3:#ffeaf3;--k1:#ff9ac8;--k2:#7dd3fc;--k3:#c4b5fd;--k4:#fde68a;--ko:.8;
--pbbg:rgba(31,21,54,.12);--pb1:#10b981;--pb2:#38bdf8;--field:rgba(255,255,255,.7);--fieldf:rgba(255,255,255,.95);--ph:rgba(31,21,54,.4);--optbg:#fff;
--btnink:#fff;--g1:#10b981;--g2:#3b82f6;--p1:#ec4899;--p2:#f59e0b;--accb:linear-gradient(135deg,rgba(236,72,153,.28),rgba(245,158,11,.28));
--gh:#b45309;--line2:rgba(31,21,54,.12);--chip:rgba(124,92,200,.14);--grp:rgba(255,255,255,.4);--drawer:rgba(250,244,255,.85);--toast:rgba(255,255,255,.92);
--salbg:linear-gradient(135deg,rgba(16,185,129,.3),rgba(59,130,246,.25),rgba(167,139,250,.28))}
:root[data-theme=green]{--ink:#eafff3;--mute:rgba(234,255,243,.62);--glass:rgba(40,255,150,.07);--line:rgba(60,255,160,.28);--green:#00ff88;--red:#ff5d73;--blue:#00e0c0;
--bg0:#020805;--bg1:#000;--bg2:#04140c;--bg3:#00110a;--k1:#00ff88;--k2:#00b36b;--k3:#0a8f5a;--k4:#7dff6b;--ko:.5;
--pbbg:rgba(60,255,160,.15);--pb1:#00ff88;--pb2:#00c2a0;--field:rgba(40,255,150,.08);--fieldf:rgba(40,255,150,.16);--ph:rgba(234,255,243,.4);--optbg:#06190f;
--btnink:#00130a;--g1:#00ff88;--g2:#00c2a0;--p1:#7dff6b;--p2:#00e0a0;--accb:linear-gradient(135deg,rgba(0,255,136,.3),rgba(0,194,160,.25));
--gh:#7dffb8;--line2:rgba(60,255,160,.16);--chip:rgba(60,255,160,.14);--grp:rgba(40,255,150,.05);--drawer:rgba(2,16,9,.85);--toast:rgba(3,22,13,.92);
--salbg:linear-gradient(135deg,rgba(0,255,136,.28),rgba(0,194,160,.22),rgba(125,255,107,.2))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg0);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));transition:background .4s}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:var(--ko);transition:background .4s}
.bg i:nth-child(1){width:300px;height:300px;background:var(--k1);top:-80px;left:-90px}
.bg i:nth-child(2){width:280px;height:280px;background:var(--k2);top:35%;right:-110px}
.bg i:nth-child(3){width:320px;height:320px;background:var(--k3);bottom:-100px;left:-60px}
.bg i:nth-child(4){width:200px;height:200px;background:var(--k4);bottom:22%;left:35%;opacity:.35}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 8px 32px rgba(0,0,0,.25)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;margin:10px 12px 0;border-radius:18px}
header b{flex:1;font-size:17px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:20px;display:grid;place-items:center}
main{padding:14px 12px 40px;max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar h1{flex:1;margin:0;text-align:center;font-size:24px}
.months{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;color:inherit;position:relative;overflow:hidden}
.mt::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.mt b{font-size:17px}.mt .sal{font-weight:600;color:var(--ink)}.mt small{color:var(--mute)}
.mt.cur{box-shadow:0 0 0 2px var(--c),0 8px 32px rgba(0,0,0,.25)}
.pb{height:7px;background:var(--pbbg);border-radius:6px;overflow:hidden;margin:3px 0}
.pb u{display:block;height:100%;background:linear-gradient(90deg,var(--pb1),var(--pb2));border-radius:6px}
.pb u.over{background:linear-gradient(90deg,#ff9a5a,var(--red))}
.card{padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--field);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:16px;outline:0;appearance:none;-webkit-appearance:none}
input::placeholder{color:var(--ph)}
input:focus,select:focus{border-color:var(--ink);background:var(--fieldf)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 19px) 55%,calc(100% - 13px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
option{background:var(--optbg);color:var(--ink)}
.btn{width:100%;padding:13px;border:0;border-radius:14px;font-weight:700;color:var(--btnink);background:linear-gradient(135deg,var(--g1),var(--g2))}
.btn.alt{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn.pink{background:linear-gradient(135deg,var(--p1),var(--p2))}
.accb{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-weight:700;font-size:16px;color:var(--ink);margin-bottom:0;background:var(--accb)}
.accb i{font-style:normal;transition:transform .35s}
.acc.open .accb i{transform:rotate(180deg)}
.acc{margin-bottom:14px}
.accbody{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-12px);transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1),opacity .35s,transform .4s cubic-bezier(.2,.8,.2,1)}
.acc.open .accbody{grid-template-rows:1fr;opacity:1;transform:none}
.accin{overflow:hidden;min-height:0}
.accin .card{margin:12px 0 0}
.salcard{position:relative;overflow:hidden;padding:20px 18px;background:var(--salbg)}
.salcard::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{left:-70%}55%,100%{left:140%}}
.salcard .sl{font-size:13px;color:var(--mute)}
.salcard .sv{font-size:32px;font-weight:800;letter-spacing:.3px;text-shadow:0 2px 14px rgba(0,0,0,.25);margin-top:2px}
.salcard .edit{position:absolute;top:10px;right:10px;width:36px;height:36px;font-size:17px;z-index:2}
@media(prefers-reduced-motion:reduce){.salcard::after{animation:none;display:none}}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.sum div{padding:11px 8px;text-align:center}
.sum span{display:block;font-size:11px;color:var(--mute)}.sum b{font-size:15px}
.neg{color:var(--red)}.pos{color:var(--green)}
.gh{display:flex;justify-content:space-between;font-weight:700;margin:12px 0 4px;color:var(--gh)}
.er{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2)}
.er div{flex:1;min-width:0}.er small{display:block;color:var(--mute)}
.er .a{font-weight:600;background:none;border:0;padding:4px}
.x{background:none;border:0;color:var(--mute);font-size:17px;padding:4px 8px}
.empty{color:var(--mute);padding:8px 0}
#login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#login img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#login .box{padding:28px 22px;width:100%;max-width:360px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border:0;border-radius:14px;background:#fff;color:#222;font-weight:700}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(340px,90vw);z-index:10;transform:translateX(-102%);transition:transform .22s;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px;border-radius:0 22px 22px 0;background:var(--drawer)}
body.open #drawer{transform:none}body.open #scrim{display:block}
.grp{border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;background:var(--grp)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--chip);border-radius:20px;padding:3px 4px 3px 12px;font-size:14px}
.add{display:flex;gap:6px}.add input{margin:0;padding:9px 11px}
.th{display:flex;gap:8px;margin:12px 0 4px}
.th button{flex:1;padding:10px 4px;border-radius:14px;border:2px solid transparent;background:var(--glass);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.th button.on{border-color:var(--ink)}
.th i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}.add button{width:auto;padding:9px 14px}
.user{font-size:12px;color:var(--mute);word-break:break-all;margin:6px 0 12px}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;background:var(--toast);border:1px solid var(--line)}
#toast.on{opacity:1}
</style></head><body>
<div class="bg"><i></i><i></i><i></i><i></i></div>
<header class="glass" id="hd" hidden><button class="ib" id="mb" aria-label="Menu">☰</button><b>Budget Planner</b></header>
<main id="view"></main>
<div id="scrim"></div><aside id="drawer" class="glass"></aside><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,addDoc,getDocs,query,where,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyADPViNMNDI2wYG8mPP4tgOeKx-Cle0LsE",
  authDomain:"budget-planer-54984.firebaseapp.com",
  projectId:"budget-planer-54984",
  storageBucket:"budget-planer-54984.firebasestorage.app",
  messagingSenderId:"157760808012",
  appId:"1:157760808012:web:e6f90c7e257ca9115b00e9"});
const auth=getAuth(app),fs=getFirestore(app);
const $=s=>document.querySelector(s);
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const COL=["#ff6bb5","#ff8a5c","#ffd166","#a3e635","#3ff2a5","#22d3ee","#5ab0ff","#8b9cff","#c084fc","#f472b6","#fb923c","#34d399"];
const DEFAULTS=[["Bills",["Electricity","Water","Internet","Phone"]],["Loans",["Bank loan","Leasing","Credit card"]],["Food",["Groceries","Eating out"]],["Transport",["Fuel","Bus / Train"]],["Savings",["Savings","Fixed deposit"]],["Other",["Medical","Gifts"]]].map(([name,items])=>({name,items}));
let SE=false,OPEN=false,U=null,Y=new Date().getFullYear(),M=null,L=[];
const fmt=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const THEMES=[["purple","Purple","linear-gradient(135deg,#ff3d9a,#8b5cf6,#22d3ee)","#1b1038"],["light","White","linear-gradient(135deg,#fff,#e3d4ff,#bfe3ff)","#f3e8ff"],["green","Black & Green","linear-gradient(135deg,#000,#00b36b,#00ff88)","#000000"]];
function applyTheme(t){if(!THEMES.some(x=>x[0]==t))t="purple";document.documentElement.dataset.theme=t;try{localStorage.setItem("bp-theme",t)}catch(e){}$('#tc').content=THEMES.find(x=>x[0]==t)[3]}
applyTheme(document.documentElement.dataset.theme);
const pad=n=>String(n).padStart(2,'0');
const dLabel=d=>{if(!d)return'';const [,m,day]=d.split('-');return +day+' '+MN[m-1].slice(0,3)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
const ref=(...p)=>doc(fs,"users",U.uid,...p),col=n=>collection(fs,"users",U.uid,n);

/* ---------- auth ---------- */
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"}); // always lets you pick the Gmail account
async function login(){
  try{await signInWithPopup(auth,provider)}
  catch(e){
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code))await signInWithRedirect(auth,provider);
    else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")toast("Login failed: "+e.code)}
}
function showLogin(){
  $('#hd').hidden=true;
  $('#view').innerHTML=`<div id="login"><img src="icon-512.png" alt=""><div class="glass box"><h1 style="margin:0 0 6px">Budget Planner</h1><p style="color:var(--mute);margin:0 0 20px">Manage your salary and expenses, synced on all your devices.</p>
  <button class="gbtn" data-a="login"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 33.1 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3-11.3-7.3l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.7-.4-4z"/></svg>Continue with Google</button></div></div>`;
}
onAuthStateChanged(auth,async u=>{
  U=u;
  if(!u){showLogin();return}
  $('#hd').hidden=false;
  await loadLists();showYear();
});

/* ---------- data ---------- */
async function loadLists(){
  const s=await getDoc(ref("meta","lists"));
  if(s.exists())L=s.data().groups;
  else{L=DEFAULTS;await saveLists()}
}
const saveLists=()=>setDoc(ref("meta","lists"),{groups:L});

async function monthData(y,m){
  const s=await getDoc(ref("months",y+"_"+m));
  const q=await getDocs(query(col("entries"),where("y","==",y),where("m","==",m)));
  const e=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0));
  return{salary:s.exists()?s.data().salary:0,entries:e};
}

/* ---------- views ---------- */
async function showYear(){
  M=null;
  const out={};for(let i=1;i<=12;i++)out[i]={salary:0,spent:0};
  const [ms,es]=await Promise.all([getDocs(query(col("months"),where("y","==",Y))),getDocs(query(col("entries"),where("y","==",Y)))]);
  ms.forEach(d=>{const x=d.data();out[x.m].salary=x.salary});
  es.forEach(d=>{const x=d.data();out[x.m].spent+=x.amount});
  const now=new Date();
  $('#view').innerHTML=`<div class="bar"><button class="ib" data-a="y-" aria-label="Previous year">‹</button><h1>${Y}</h1><button class="ib" data-a="y+" aria-label="Next year">›</button></div><div class="months">`+
  MN.map((n,i)=>{const s=out[i+1],raw=s.salary?s.spent/s.salary*100:0,cur=now.getFullYear()==Y&&now.getMonth()==i;
    return `<button class="glass mt${cur?' cur':''}" style="--c:${COL[i]}" data-a="month" data-m="${i+1}"><b>${n}</b><span class="sal">${s.salary?'Rs. '+fmt(s.salary):'No salary yet'}</span><i class="pb"><u class="${raw>100?'over':''}" style="width:${Math.min(100,raw)}%"></u></i><small>Spent ${fmt(s.spent)}</small><small>Left ${fmt(s.salary-s.spent)}</small></button>`}).join('')+'</div>';
}

async function showMonth(m){
  M=m;const d=await monthData(Y,m);
  const spent=d.entries.reduce((a,e)=>a+e.amount,0),left=d.salary-spent,by={};
  d.entries.forEach(e=>(by[e.grp]=by[e.grp]||[]).push(e));
  const now=new Date(),dMin=`${Y}-${pad(m)}-01`,
    dDef=(now.getFullYear()==Y&&now.getMonth()+1==m)?`${Y}-${pad(m)}-${pad(now.getDate())}`:dMin;
  const salHTML=(d.salary&&!SE)
   ?`<div class="glass card salcard"><button class="ib edit" data-a="sedit" aria-label="Edit salary">✎</button><div class="sl">${MN[m-1]} salary</div><div class="sv">Rs. ${fmt(d.salary)}</div></div>`
   :`<div class="glass card"><h2>Salary</h2><label>Salary for ${MN[m-1]} (Rs.)<input id="sal" type="number" inputmode="decimal" min="0" step="0.01" value="${d.salary||''}" placeholder="0.00"></label><button class="btn" data-a="sal">Save salary</button>${d.salary?'<button class="btn alt" data-a="scancel" style="margin-top:8px">Cancel</button>':''}</div>`;
  const rows=Object.keys(by).map(g=>`<div class="gh"><span>${esc(g)}</span><span>${fmt(by[g].reduce((a,e)=>a+e.amount,0))}</span></div>`+
   by[g].map(e=>`<div class="er"><div>${esc(e.item)}${(e.date||e.note)?`<small>${dLabel(e.date)}${e.date&&e.note?' · ':''}${esc(e.note||'')}</small>`:''}</div><button class="a" data-a="edit" data-id="${e.id}" data-amt="${e.amount}">${fmt(e.amount)}</button><button class="x" data-a="del" data-id="${e.id}" aria-label="Delete">✕</button></div>`).join('')).join('');
  $('#view').innerHTML=`<div class="bar"><button class="ib" data-a="m-" aria-label="Previous month">‹</button><h1>${MN[m-1]} ${Y}</h1><button class="ib" data-a="m+" aria-label="Next month">›</button></div>
  <button class="btn alt" data-a="year" style="margin-bottom:14px">All months</button>
  ${salHTML}
  <div class="sum"><div class="glass"><span>Spent</span><b>${fmt(spent)}</b></div><div class="glass"><span>Left</span><b class="${left<0?'neg':'pos'}">${fmt(left)}</b></div></div>
  <div class="acc${OPEN?' open':''}"><button class="glass accb" data-a="toggle" aria-expanded="${OPEN}"><span>＋ Add expense</span><i>▾</i></button><div class="accbody"><div class="accin"><div class="glass card">
   <label>Category<select id="eg">${L.map(g=>`<option>${esc(g.name)}</option>`).join('')}</select></label>
   <label>Item<select id="ei"></select></label>
   <label id="ec" hidden>Your own item<input id="eic" placeholder="Type a name"></label>
   <label>Amount (Rs.)<input id="ea" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></label>
   <label>Date<input id="ed" type="date" value="${dDef}"></label>
   <label>Note<input id="en" placeholder="Optional"></label>
   <button class="btn pink" data-a="add">Add expense</button></div></div></div></div>
  <div class="glass card"><h2>${MN[m-1]} expenses</h2>${rows||'<div class="empty">No expenses yet.</div>'}</div>`;
  fillItems();if(SE&&$('#sal'))$('#sal').focus();
}
function fillItems(){
  const g=$('#eg');if(!g)return;const grp=L.find(x=>x.name==g.value);
  $('#ei').innerHTML=((grp&&grp.items)||[]).map(i=>`<option>${esc(i)}</option>`).join('')+'<option value="__c">Type my own…</option>';
  $('#ec').hidden=$('#ei').value!='__c';
}
document.addEventListener('change',e=>{if(e.target.id=='eg')fillItems();if(e.target.id=='ei')$('#ec').hidden=e.target.value!='__c'});

function drawer(){
  $('#drawer').innerHTML=`<h2 style="margin:0">Manage lists</h2><div class="user">${esc(U?.email||'')}</div>
  <button class="btn pink" data-a="logout">Log out</button>
  <div class="th">${THEMES.map(t=>`<button data-a="theme" data-t="${t[0]}" class="${document.documentElement.dataset.theme==t[0]?'on':''}"><i style="background:${t[2]}"></i>${t[1]}</button>`).join('')}</div>
  <div style="color:var(--mute);font-size:13px;margin-top:12px">These feed the dropdowns when you add an expense.</div>`+
  L.map((g,gi)=>`<div class="grp"><div class="top"><span>${esc(g.name)}</span><button class="x" data-a="dg" data-g="${gi}">Delete</button></div>
   <div class="chips">${g.items.map((it,ii)=>`<span class="chip">${esc(it)} <button class="x" data-a="di" data-g="${gi}" data-i="${ii}" aria-label="Remove">✕</button></span>`).join('')||'<span class="empty">No items yet</span>'}</div>
   <div class="add"><input placeholder="New item" data-in="${gi}"><button class="btn" data-a="ai" data-g="${gi}">Add</button></div></div>`).join('')+
  `<div class="grp"><div class="top">New category</div><div class="add" style="margin-top:8px"><input id="ng" placeholder="e.g. Insurance"><button class="btn" data-a="ag">Add</button></div></div>`;
}
const tog=o=>document.body.classList.toggle('open',o);
function closeDrawer(){tog(false);if(M)showMonth(M)}
$('#mb').onclick=()=>{drawer();tog(true)};$('#scrim').onclick=closeDrawer;

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;
  try{
  if(a=='login')return login();
  if(a=='theme'){applyTheme(D.t);return drawer()}
  if(a=='logout'){tog(false);await signOut(auth);return}
  if(a=='y-'){Y--;return showYear()} if(a=='y+'){Y++;return showYear()}
  if(a=='year')return showYear();
  if(a=='toggle'){OPEN=!OPEN;b.closest('.acc').classList.toggle('open',OPEN);b.setAttribute('aria-expanded',OPEN);return}
  if(a=='month'){SE=false;OPEN=false;return showMonth(+D.m)}
  if(a=='m-'||a=='m+'){let m=M+(a=='m+'?1:-1);if(m<1){m=12;Y--}if(m>12){m=1;Y++}SE=false;OPEN=false;return showMonth(m)}
  if(a=='sal'){await setDoc(ref("months",Y+"_"+M),{y:Y,m:M,salary:parseFloat($('#sal').value)||0});SE=false;toast('Salary saved');return showMonth(M)}
  if(a=='sedit'){SE=true;return showMonth(M)}
  if(a=='scancel'){SE=false;return showMonth(M)}
  if(a=='add'){
    const grp=$('#eg').value;let item=$('#ei').value;if(item=='__c')item=$('#eic').value.trim();
    const amount=parseFloat($('#ea').value),date=$('#ed').value;
    if(!grp)return toast('Add a category in the menu first');
    if(!item)return toast('Choose or type an item');
    if(!(amount>=0))return toast('Enter an amount');
    if(!date)return toast('Choose a date');
    await addDoc(col("entries"),{y:Y,m:M,grp,item,amount,date,note:$('#en').value,ts:Date.now()});
    toast('Expense added');await showMonth(M);$('#eg').value=grp;fillItems();$('#ed').value=date;return}
  if(a=='edit'){const v=prompt('New amount',D.amt);if(v===null)return;const n=parseFloat(v);if(!(n>=0))return toast('Enter a valid amount');await updateDoc(ref("entries",D.id),{amount:n});return showMonth(M)}
  if(a=='del'){if(!confirm('Delete this expense?'))return;await deleteDoc(ref("entries",D.id));return showMonth(M)}
  /* list management */
  if(a=='dg'){if(!confirm(`Delete category "${L[D.g].name}"? Past expenses stay.`))return;L.splice(D.g,1)}
  else if(a=='di')L[D.g].items.splice(D.i,1);
  else if(a=='ai'){const v=document.querySelector(`[data-in="${D.g}"]`).value.trim();if(!v)return;if(!L[D.g].items.includes(v))L[D.g].items.push(v)}
  else if(a=='ag'){const v=$('#ng').value.trim();if(!v||L.some(x=>x.name==v))return;L.push({name:v,items:[]})}
  else return;
  await saveLists();drawer();
  }catch(err){toast('Error: '+(err.code||err.message))}
});
document.addEventListener('keydown',e=>{
  if(e.key=='Escape')closeDrawer();
  if(e.key=='Enter'&&e.target.tagName=='INPUT'){const p=e.target.closest('.add');if(p)p.querySelector('button').click();else if(e.target.id=='ea')document.querySelector('[data-a=add]').click()}});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
